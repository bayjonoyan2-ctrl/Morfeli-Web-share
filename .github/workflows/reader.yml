name: Morfeli Site Reader

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm init -y
          npm i playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install chromium

      - name: Run inside virtual display
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node clicker.js
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          WEBSHARE_PROXIES: ${{ secrets.WEBSHARE_PROXIES }}
